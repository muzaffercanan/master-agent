<title>Bilgisayar Master Atlası</title>
<meta name="description" content="Türkiye'de bilgisayar bilimleri mezunları için yüksek lisans programları, başvuru takvimleri, şartlar ve araştırma gücü; şehir şehir.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style>
:root{
  --bg:#F2F4F7;
  --paper:#FFFFFF;
  --sunk:#E7EBF0;
  --ink:#111A26;
  --ink-2:#3B4757;
  --muted:#697788;
  --line:#DCE2E9;
  --line-2:#C8D1DB;
  --accent:#20459B;
  --accent-ink:#FFFFFF;
  --accent-soft:#E4EAF8;
  --accent-line:#B9C7E8;
  --copper:#9A5A21;
  --copper-soft:#F6EBDF;
  --ok:#166B45;
  --ok-soft:#DFF0E7;
  --warn:#8E5406;
  --warn-soft:#FAEBD5;
  --bad:#A62A20;
  --bad-soft:#F8E2DF;
  --star:#C08A16;
  --focus:#20459B;
  --shadow-1:0 1px 2px rgba(17,26,38,.05), 0 1px 1px rgba(17,26,38,.04);
  --shadow-2:0 2px 4px rgba(17,26,38,.05), 0 8px 22px -12px rgba(17,26,38,.18);
  --shadow-bar:0 1px 0 var(--line), 0 6px 20px -16px rgba(17,26,38,.5);
  --display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r-s:7px; --r-m:11px; --r-l:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0C121B;
    --paper:#141D29;
    --sunk:#1B2634;
    --ink:#E7ECF2;
    --ink-2:#BDC8D6;
    --muted:#8D9BAC;
    --line:#26313F;
    --line-2:#33404F;
    --accent:#8BA9F5;
    --accent-ink:#0B1424;
    --accent-soft:#182540;
    --accent-line:#2E4270;
    --copper:#DFA572;
    --copper-soft:#2E2318;
    --ok:#66CC96;
    --ok-soft:#12321F;
    --warn:#E9A752;
    --warn-soft:#33240F;
    --bad:#F0837A;
    --bad-soft:#3A1B18;
    --star:#E0B54A;
    --focus:#8BA9F5;
    --shadow-1:0 1px 2px rgba(0,0,0,.35);
    --shadow-2:0 2px 6px rgba(0,0,0,.35), 0 14px 30px -18px rgba(0,0,0,.7);
    --shadow-bar:0 1px 0 var(--line), 0 10px 26px -20px #000;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C121B;
  --paper:#141D29;
  --sunk:#1B2634;
  --ink:#E7ECF2;
  --ink-2:#BDC8D6;
  --muted:#8D9BAC;
  --line:#26313F;
  --line-2:#33404F;
  --accent:#8BA9F5;
  --accent-ink:#0B1424;
  --accent-soft:#182540;
  --accent-line:#2E4270;
  --copper:#DFA572;
  --copper-soft:#2E2318;
  --ok:#66CC96;
  --ok-soft:#12321F;
  --warn:#E9A752;
  --warn-soft:#33240F;
  --bad:#F0837A;
  --bad-soft:#3A1B18;
  --star:#E0B54A;
  --focus:#8BA9F5;
  --shadow-1:0 1px 2px rgba(0,0,0,.35);
  --shadow-2:0 2px 6px rgba(0,0,0,.35), 0 14px 30px -18px rgba(0,0,0,.7);
  --shadow-bar:0 1px 0 var(--line), 0 10px 26px -20px #000;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.58;margin:0;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{text-decoration-color:var(--accent-line)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;text-wrap:balance;line-height:1.14;margin:0;letter-spacing:-.012em}
h1{font-size:clamp(2.25rem,5.4vw,3.5rem);font-weight:700}
h2{font-size:clamp(1.6rem,3.2vw,2.15rem)}
h3{font-size:1.32rem}
p{margin:0}
b,strong{font-weight:600}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.11em;text-transform:uppercase;color:var(--copper);font-weight:500}
.lede{font-size:1.07rem;max-width:70ch;color:var(--ink-2)}
.muted{color:var(--muted)}
.small{font-size:.87rem}
hr.rule{border:0;border-top:1px solid var(--line);margin:0}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(14px) saturate(1.2);box-shadow:var(--shadow-bar)}
.topbar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:-.01em;white-space:nowrap}
.brand .mark{width:24px;height:24px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--mono);font-size:.7rem;font-weight:600;flex:0 0 auto}
.searchbox{position:relative;flex:1 1 200px;min-width:0;max-width:420px;margin-left:auto}
.searchbox input{width:100%;font:inherit;font-size:.9rem;padding:8px 32px 8px 32px;border:1px solid var(--line-2);border-radius:999px;background:var(--bg);color:var(--ink)}
.searchbox input::placeholder{color:var(--muted)}
.searchbox .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);display:grid;pointer-events:none}
.searchbox .clr{position:absolute;right:5px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);cursor:pointer;font-size:1rem;line-height:1;padding:5px 7px;border-radius:999px}
.searchbox .clr:hover{color:var(--ink);background:var(--sunk)}
.iconbtn{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;font:inherit;font-size:.84rem;padding:7px 11px;border:1px solid var(--line-2);border-radius:999px;background:var(--paper);color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s,color .15s}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.iconbtn svg{width:15px;height:15px;display:block}
.iconbtn .n{font-family:var(--mono);font-size:.78rem;background:var(--sunk);padding:1px 6px;border-radius:999px;color:var(--ink)}
.iconbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.iconbtn.on .n{background:color-mix(in srgb,var(--accent-ink) 22%,transparent);color:var(--accent-ink)}
@media (max-width:700px){ .brand .full{display:none} .iconbtn .lbl{display:none} }

/* ---------- hero ---------- */
header.hero{background:var(--paper);border-bottom:1px solid var(--line);position:relative;overflow:hidden}
header.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(760px 320px at 88% -18%, var(--accent-soft), transparent 70%),
  radial-gradient(520px 260px at 4% 108%, var(--copper-soft), transparent 72%)}
header.hero .wrap{position:relative;z-index:1;padding-block:clamp(34px,6vw,58px) 30px;display:grid;gap:26px}
.hero-top{display:grid;gap:14px;max-width:74ch}
.hero-legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.9rem;color:var(--muted);align-items:center}
.statrail{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;max-width:620px}
.statrail div{background:var(--paper);padding:11px 14px;display:grid;gap:1px}
.statrail .n{font-family:var(--mono);font-size:1.3rem;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.statrail .n.date{font-size:.92rem;line-height:1.9}
.statrail .l{font-size:.76rem;color:var(--muted);letter-spacing:.02em}
.urgent{display:grid;grid-template-columns:repeat(auto-fit,minmax(244px,1fr));gap:12px}
.urgent .u{border:1px solid var(--line);border-left:3px solid var(--copper);border-radius:var(--r-s);padding:12px 15px;background:var(--bg);display:grid;gap:3px}
.urgent .u.hot{border-left-color:var(--bad)}
.urgent .u .when{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.urgent .u .what{font-weight:600;font-size:.98rem}
.urgent .u .left{font-family:var(--mono);font-size:.83rem;font-weight:500;margin-top:2px}

/* ---------- section nav ---------- */
nav.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 51px);z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav.toc .wrap{display:flex;gap:4px;overflow-x:auto;padding-block:8px;scrollbar-width:none}
nav.toc .wrap::-webkit-scrollbar{display:none}
nav.toc a{flex:0 0 auto;text-decoration:none;color:var(--ink-2);font-size:.85rem;padding:6px 12px;border-radius:999px;white-space:nowrap;transition:background .15s,color .15s}
nav.toc a:hover{background:var(--sunk);color:var(--ink)}
nav.toc a.active{background:var(--accent);color:var(--accent-ink)}

section{padding-block:clamp(38px,5vw,56px);border-bottom:1px solid var(--line)}
.sec-head{display:grid;gap:9px;margin-bottom:24px}

/* ---------- pills, chips ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:.7rem;line-height:1;padding:4px 8px;border-radius:5px;white-space:nowrap;border:1px solid transparent;font-weight:500}
.pill.kesin{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.pill.tahmin{border:1px dashed var(--line-2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.near{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.na{background:var(--sunk);color:var(--muted)}
.chip{display:inline-block;font-size:.73rem;padding:2px 8px;border-radius:5px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}

/* ---------- timeline ---------- */
.tl{display:grid;gap:0}
.tl-month{display:grid;grid-template-columns:104px 1fr;gap:18px;padding-block:16px;border-top:1px solid var(--line);position:relative}
.tl-month:first-child{border-top:0;padding-top:0}
.tl-month .m{font-family:var(--mono);font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-top:12px;position:sticky;top:112px;align-self:start}
.tl-items{display:grid;gap:8px}
.tl-item{display:grid;grid-template-columns:minmax(132px,168px) 1fr auto;gap:5px 16px;align-items:start;padding:12px 14px;border-radius:var(--r-s);background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow-1);transition:box-shadow .16s,border-color .16s}
.tl-item:hover{box-shadow:var(--shadow-2);border-color:var(--line-2)}
.tl-item.past{opacity:.5;box-shadow:none}
.tl-item .d{font-family:var(--mono);font-size:.8rem;color:var(--muted);padding-top:1px}
.tl-item .t{font-weight:600}
.tl-item .x{grid-column:2 / 3;font-size:.88rem;color:var(--muted)}
.tl-item .s{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.left-pill{font-family:var(--mono);font-size:.75rem;color:var(--ink-2)}
.tl-item.soon{border-color:var(--bad);border-left-width:3px}
.tl-item.soon .left-pill{color:var(--bad);font-weight:600}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-m);background:var(--paper);box-shadow:var(--shadow-1)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:10px 13px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--sunk);white-space:nowrap}
tbody tr:hover{background:color-mix(in srgb,var(--sunk) 45%,transparent)}
tr:last-child td{border-bottom:0}
td .sub{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
td.nowrap{white-space:nowrap}

/* ---------- boxes ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(304px,1fr));gap:16px}
.box{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);padding:18px 20px;display:grid;gap:10px;align-content:start;box-shadow:var(--shadow-1)}
.box h3{font-size:1.13rem}
.box ul{margin:0;padding-left:19px;display:grid;gap:6px;color:var(--ink-2)}
.box ul li::marker{color:var(--line-2)}
.box .tbl-wrap{box-shadow:none}
.callout{border:1px solid var(--accent-line);background:var(--accent-soft);padding:14px 16px;border-radius:var(--r-m);font-size:.93rem;color:var(--ink)}
.callout.warn{border-color:color-mix(in srgb,var(--warn) 40%,var(--line));background:var(--warn-soft)}

/* ---------- checker ---------- */
.checker{display:grid;gap:14px}
.checker-form{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:end;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);padding:16px 18px;box-shadow:var(--shadow-1)}
.field{display:grid;gap:5px}
.field label{font-size:.72rem;color:var(--muted);font-family:var(--mono);letter-spacing:.07em;text-transform:uppercase}
.field input,.field select{font:inherit;font-family:var(--mono);font-size:.92rem;padding:8px 11px;border:1px solid var(--line-2);border-radius:var(--r-s);background:var(--bg);color:var(--ink);width:128px}
.field select{width:auto;min-width:150px}
.summary-line{font-size:.9rem;color:var(--muted);margin-left:auto}
.summary-line b{font-family:var(--mono)}

/* ---------- filters ---------- */
.filters{display:grid;gap:9px;margin-bottom:18px}
.frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.frow .lbl{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:8px;min-width:46px}
.fbtn{font:inherit;font-size:.84rem;padding:5px 11px;border-radius:999px;border:1px solid var(--line-2);background:var(--paper);color:var(--ink-2);cursor:pointer;transition:border-color .15s,background .15s,color .15s}
.fbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fbtn[aria-pressed="true"] .muted{color:color-mix(in srgb,var(--accent-ink) 75%,transparent)}
.fbtn:hover{border-color:var(--accent);color:var(--accent)}
.fbtn[aria-pressed="true"]:hover{color:var(--accent-ink)}

/* ---------- uni cards ---------- */
.city-block{display:grid;gap:14px;margin-bottom:34px}
.city-title{display:flex;align-items:center;gap:14px;padding-bottom:8px;border-bottom:1px solid var(--line-2)}
.city-title h3{font-size:1.55rem}
.city-title::after{content:"";flex:1}
.uni{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;box-shadow:var(--shadow-1);transition:box-shadow .18s,border-color .18s}
.uni:hover{box-shadow:var(--shadow-2)}
.uni.fav{border-color:var(--accent-line)}
.uni-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px 18px;padding:17px 19px 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,color-mix(in srgb,var(--sunk) 34%,var(--paper)),var(--paper))}
.uni-head h4{font-size:1.36rem;font-weight:600}
.uni-head .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.starbtn{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:.8rem;padding:6px 11px;border:1px solid var(--line-2);border-radius:999px;background:var(--paper);color:var(--muted);cursor:pointer;transition:all .15s}
.starbtn:hover{border-color:var(--star);color:var(--star)}
.starbtn svg{width:14px;height:14px;display:block;fill:none;stroke:currentColor;stroke-width:1.7}
.starbtn[aria-pressed="true"]{border-color:var(--star);color:var(--star);background:color-mix(in srgb,var(--star) 12%,transparent)}
.starbtn[aria-pressed="true"] svg{fill:currentColor}
.uni-body{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.uni-body > div{padding:16px 19px;display:grid;gap:13px;align-content:start}
.uni-body > div + div{border-left:1px solid var(--line);background:color-mix(in srgb,var(--sunk) 34%,var(--paper))}
.kv{display:grid;gap:3px}
.kv .k{font-family:var(--mono);font-size:.69rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.kv .v{font-size:.9rem;color:var(--ink-2)}
.progs{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.progs li{display:grid;gap:3px;padding:0 0 9px 11px;border-bottom:1px solid var(--line);border-left:2px solid transparent}
.progs li:last-child{border-bottom:0;padding-bottom:0}
.progs .pn{font-weight:600;line-height:1.35}
.progs .pt{font-family:var(--mono);font-size:.73rem;color:var(--copper)}
.progs .pd{font-size:.86rem;color:var(--muted)}
.progs .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.progs li.hit{border-left-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 55%,transparent);border-radius:0 var(--r-s) var(--r-s) 0}
.progs li.hit .pn{color:var(--accent)}
.people{margin:0;padding-left:18px;font-size:.87rem;display:grid;gap:3px;color:var(--ink-2)}
.people li::marker{color:var(--line-2)}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem}
.count-line{font-size:.9rem;color:var(--muted);margin-bottom:14px}
mark{background:color-mix(in srgb,var(--star) 34%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.empty{background:var(--paper);border:1px dashed var(--line-2);border-radius:var(--r-m);padding:26px;text-align:center;color:var(--muted)}

/* ---------- fields ---------- */
.fields{display:grid;gap:13px}
.fcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);padding:18px 20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:12px 26px;box-shadow:var(--shadow-1)}
.fcard h3{font-size:1.16rem}
.fcard .where{font-size:.86rem;display:grid;gap:5px;color:var(--ink-2)}
.fcard .where b{color:var(--ink)}

/* ---------- bars ---------- */
.bar{height:7px;border-radius:99px;background:var(--sunk);position:relative;min-width:80px}
.bar > i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 62%,var(--copper)))}

footer{padding-block:38px 64px;color:var(--muted);font-size:.87rem;background:var(--paper)}
.srcs{columns:2 320px;column-gap:30px;padding-left:18px;margin:0}
.srcs li{margin-bottom:6px;break-inside:avoid}

@media (max-width:820px){
  .uni-body{grid-template-columns:1fr}
  .uni-body > div + div{border-left:0;border-top:1px solid var(--line)}
  .fcard{grid-template-columns:1fr}
}
@media (max-width:640px){
  .tl-month{grid-template-columns:1fr;gap:6px}
  .tl-month .m{position:static;padding-top:0}
  .tl-item{grid-template-columns:1fr}
  .tl-item .x{grid-column:auto}
  .tl-item .s{flex-direction:row;align-items:center;justify-content:flex-start}
  .summary-line{margin-left:0}
}
html{scroll-behavior:smooth}
section{scroll-margin-top:118px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
